<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SingularEPT - Trilha Adaptativa (Gemini)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 {
            color: #0f172a;
            margin-top: 0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .panel {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #0369a1;
        }
        .quiz-box {
            background-color: #f1f5f9;
            border-left: 5px solid #0284c7;
            padding: 20px;
            border-radius: 0 8px 8px 0;
            margin-top: 20px;
            display: none;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }
        .options-list li {
            margin-bottom: 10px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .options-list input {
            margin: 0;
            cursor: pointer;
        }
        .options-list label {
            cursor: pointer;
            font-weight: normal;
            margin: 0;
        }
        input[type=password] {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            box-sizing: border-box;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .btn-voltar {
            background-color: #64748b;
            margin-right: 10px;
            width: auto;
        }
        pre {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            display: none;
            overflow-x: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Ecossistema de Trilha de Revisão Adaptativa</h1>
        <p>Geração de trilha via inteligência artificial conectada com os metadados gerados do Anki.</p>
        
        <div class="panel">
            <h3>🧠 Conexão com o Gemini</h3>
            <div class="form-group">
                <label for="gemini-key">1. Chave API do Gemini:</label>
                <input type="password" id="gemini-key" placeholder="Cole sua API Key do Google AI Studio aqui">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-voltar" onclick="window.location.href='index.html'">⬅ Escolher outro Baralho</button>
                <button class="btn" style="flex-grow: 1;" onclick="gerarTrilhaComDadosMemoria()">Gerar Trilha Adaptativa (10 Questões)</button>
            </div>
            <p id="status-ia" style="font-weight: bold; color: #16a34a; margin-top: 10px;"></p>
            <pre id="error-log"></pre>
        </div>

        <!-- REVISÃO / QUIZ DINÂMICO -->
        <div id="quiz-container" class="quiz-box">
            <h3 id="quiz-titulo">Carregando Questões Adaptadas...</h3>
            <p id="quiz-pergunta" style="font-size: 16px; line-height: 1.6;"></p>
            <ul class="options-list" id="quiz-opcoes"></ul>
            <button class="btn" style="background-color: #10b981;" onclick="validarResposta()">Enviar Resposta e Avançar</button>
        </div>
    </div>

    <script>
        var questoesGeradas = [];
        var indiceQuestaoAtual = 0;
        var respostaCorretaIndex = null;

        window.onload = function() {
            var dadosAnki = sessionStorage.getItem("dados_anki_revisao");
            var labelStatus = document.getElementById("status-ia");
            if (!dadosAnki) {
                labelStatus.style.color = "#dc2626";
                labelStatus.innerText = "❌ Nenhum dado do Anki encontrado na memória temporária. Volte e selecione um baralho.";
            } else {
                labelStatus.style.color = "#16a34a";
                labelStatus.innerText = "📊 Dados do Anki prontos e sincronizados na memória temporária!";
            }
        };

        function gerarTrilhaComDadosMemoria() {
            var apiKey = document.getElementById("gemini-key").value.trim();
            var dadosAnki = sessionStorage.getItem("dados_anki_revisao");
            var labelStatus = document.getElementById("status-ia");
            var errorLog = document.getElementById("error-log");
            
            errorLog.style.display = "none";

            if (!apiKey) {
                alert("Por favor, cole sua API Key.");
                return;
            }
            if (!dadosAnki) {
                alert("Nenhum dado encontrado na memória temporária. Volte ao index.html e selecione o baralho novamente.");
                return;
            }

            labelStatus.style.color = "#64748b";
            labelStatus.innerText = "🧠 Acionando inteligência do Gemini...";
            document.getElementById("quiz-container").style.display = "none";

            dadosAnki = String(dadosAnki).replace(/[\u0000-\u001F\u007F-\u009F]/g, "");
            
            enviarRequisicaoGemini(apiKey, dadosAnki);
        }

        async function enviarRequisicaoGemini(apiKey, dadosAnki) {
            var labelStatus = document.getElementById("status-ia");
            var errorLog = document.getElementById("error-log");
            
            var prompt = "Você é um tutor de revisão acadêmica. Com base nestes dados de erro do Anki: " + dadosAnki + " , crie um questionário contendo exatamente 10 novas perguntas inéditas de múltipla escolha. Cada pergunta deve conter 4 alternativas de resposta. Sua resposta final DEVE ser obrigatoriamente um objeto Array estruturado em JSON válido, sem texto explicativo adicional e sem tags markdown. Siga este formato estrito: [{\"pergunta\": \"Enunciado aqui\", \"opcoes\": [\"Alternativa 1\", \"Alternativa 2\", \"Alternativa 3\", \"Alternativa 4\"], \"index_correta\": 0}]";

            try {
                var url = "https://googleapis.com" + apiKey;
                
                var payload = {
                    contents: [
                        {
                            parts: [
                                { text: prompt }
                            ]
                        }
                    ],
                    generationConfig: {
                        responseMimeType: "application/json"
                    }
                };

                var response = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                var data = await response.json();

                if (data["error"]) {
                    throw new Error("A API retornou um erro: " + data["error"]["message"]);
                }

                if (!data["candidates"] || data["candidates"]["length"] === 0) {
                    throw new Error("A API do Gemini retornou uma resposta estrutural vazia.");
                }

                // EXTRAÇÃO BLINDADA: Acessando os arrays via strings explícitas com índice zero mapeado em tempo de execução
                var idxZero = 0;
                var textoBruto = data["candidates"][idxZero]["content"]["parts"][idxZero]["text"];
                
                textoBruto = textoBruto.trim().replace(/```json/g, "").replace(/```/g, "").trim();
                questoesGeradas = JSON.parse(textoBruto);

                if (!Array.isArray(questoesGeradas) || questoesGeradas["length"] === 0) {
                    throw new Error("O formato do texto retornado não pôde ser lido como um conjunto de questões válido.");
                }

                indiceQuestaoAtual = 0;
                document.getElementById("quiz-container").style.display = "block";
                renderizarQuestao();
                
                labelStatus.style.color = "#16a34a";
                labelStatus.innerText = "✅ Trilha de 10 questões gerada com sucesso!";
                
            } catch (error) {
                console.error(error);
                labelStatus.style.color = "#dc2626";
                labelStatus.innerText = "❌ Erro crítico ao processar resposta da IA.";
                errorLog.style.display = "block";
                errorLog.innerText = "Detalhes do erro:\n" + error.message;
            }
        }

        function renderizarQuestao() {
            var questao = questoesGeradas[indiceQuestaoAtual];
            document.getElementById("quiz-titulo").innerText = "Critério de Revisão (Questão " + (indiceQuestaoAtual + 1) + " de 10)";
        }
